<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" id="nav-assets">
  <title>Assets</title>
  <!-- Asset tag (label with point at left) — industrial asset-tag metaphor -->
  <path d="M 6 24
           L 16 14
           L 40 14
           Q 42 14, 42 16
           L 42 32
           Q 42 34, 40 34
           L 16 34
           Z"
        fill="#F7941D"/>
  <!-- Tag eyelet / loop hole -->
  <circle cx="20" cy="24" r="3" fill="#FCBA63"/>
  <!-- Asset detail lines (representing asset ID + spec) -->
  <rect x="27" y="20" width="11" height="2" rx="1"   fill="#FCBA63"/>
  <rect x="27" y="25" width="8"  height="1.6" rx="0.8" fill="#FCBA63" opacity="0.75"/>
</svg>
