<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" id="nav-tickets">
  <title>Tickets</title>
  <!-- Horizontal ticket stub with notched perforations on both vertical edges -->
  <path d="M 9 10
           L 39 10
           Q 43 10, 43 14
           L 43 20
           A 4 4 0 0 0 43 28
           L 43 34
           Q 43 38, 39 38
           L 9 38
           Q 5 38, 5 34
           L 5 28
           A 4 4 0 0 1 5 20
           L 5 14
           Q 5 10, 9 10 Z"
        fill="#F7941D"/>
  <!-- Priority / status indicator on the stub side -->
  <circle cx="13" cy="24" r="3" fill="#FCBA63"/>
  <!-- Ticket detail lines (subject + meta) -->
  <rect x="20" y="20" width="18" height="2.2" rx="1.1" fill="#FCBA63"/>
  <rect x="20" y="26" width="13" height="1.8" rx="0.9" fill="#FCBA63" opacity="0.75"/>
</svg>
