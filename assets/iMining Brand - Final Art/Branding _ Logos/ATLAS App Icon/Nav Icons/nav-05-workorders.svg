        stroke="#F7941D" stroke-width="2" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24.5" y="19.5" width="8" height="2" rx="1" fill="#F7941D"/>
  <!-- Pending items -->
  <rect x="16" y="27" width="2.5" height="2" rx="0.6" fill="#F7941D" opacity="0.55"/>
  <rect x="20.5" y="27" width="11" height="2" rx="1" fill="#F7941D" opacity="0.55"/>
  <rect x="16" y="32" width="2.5" height="2" rx="0.6" fill="#F7941D" opacity="0.55"/>
  <rect x="20.5" y="32" width="9" height="2" rx="1" fill="#F7941D" opacity="0.55"/>
</svg>
