<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" id="nav-workorders">
  <title>Work Orders</title>
  <!-- Clipboard body -->
  <rect x="9" y="9" width="30" height="34" rx="3" fill="#F7941D"/>
  <!-- Clipboard clip at top -->
  <rect x="18" y="5" width="12" height="7" rx="2" fill="#F7941D"/>
  <!-- Inner "paper" surface -->
  <rect x="13" y="14" width="22" height="25" rx="1.5" fill="#FCBA63"/>
