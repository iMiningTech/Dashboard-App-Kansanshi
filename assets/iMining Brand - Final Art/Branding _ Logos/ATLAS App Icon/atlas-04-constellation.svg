<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="atlas-constellation">
  <title>ATLAS — Star Atlas / Constellation</title>
  <rect width="512" height="512" rx="96" fill="#002741"/>

  <!-- Sky circle -->
  <circle cx="256" cy="192" r="108" stroke="#F7941D" stroke-width="14" fill="none"/>

  <!-- Constellation forming an 'A' for ATLAS -->
  <g stroke="#F7941D" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Left leg of A -->
    <line x1="216" y1="250" x2="256" y2="138"/>
    <!-- Right leg of A -->
    <line x1="256" y1="138" x2="296" y2="250"/>
    <!-- Crossbar of A -->
    <line x1="232" y1="208" x2="280" y2="208"/>
  </g>

  <!-- Stars on the constellation vertices -->
  <g fill="#FCBA63">
    <circle cx="256" cy="138" r="11"/>
    <circle cx="216" cy="250" r="10"/>
    <circle cx="296" cy="250" r="10"/>
    <circle cx="232" cy="208" r="7"/>
    <circle cx="280" cy="208" r="7"/>
  </g>

  <!-- Faint background stars (atmosphere) -->
  <g fill="#FFDAA2" opacity="0.7">
    <circle cx="190" cy="160" r="3"/>
    <circle cx="320" cy="170" r="3.5"/>
    <circle cx="200" cy="225" r="2.5"/>
    <circle cx="312" cy="225" r="3"/>
    <circle cx="256" cy="265" r="3"/>
  </g>

  <!-- Stem -->
  <path d="M 232 322 L 280 322 L 280 446 Q 280 470 256 470 Q 232 470 232 446 Z" fill="#F7941D"/>
</svg>
