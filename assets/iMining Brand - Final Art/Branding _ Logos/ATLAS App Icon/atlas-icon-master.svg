<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="atlas-icon">
  <title>iMining ATLAS — App Icon</title>
  <desc>Asset management icon: globe with four site pins, preserving the iMining "i" geometry.</desc>

  <!-- iOS-style rounded-square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#002741"/>

  <!-- Globe (the dot of the 'i') -->
  <g transform="translate(256 192)">
    <!-- Outer globe ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#F7941D" stroke-width="14"/>

    <!-- Equator: subtle so pins read cleanly -->
    <line x1="-108" y1="0" x2="108" y2="0"
          stroke="#F7941D" stroke-width="3.5" stroke-linecap="round" opacity="0.32"/>

    <!-- Meridian: subtle -->
    <ellipse cx="0" cy="0" rx="40" ry="108"
             stroke="#F7941D" stroke-width="3" fill="none" opacity="0.28"/>

    <!-- Site pins — 1 primary + 3 supporting, asymmetric placement -->
    <!-- Primary site (highlighted asset): upper-left, with inner highlight ring -->
    <circle cx="-34" cy="-46" r="17" fill="#F7941D"/>
    <circle cx="-34" cy="-46" r="7"  fill="#FFDAA2"/>

    <!-- Supporting sites: peach -->
    <circle cx="48"  cy="-22" r="13" fill="#FCBA63"/>
    <circle cx="-48" cy="38"  r="13" fill="#FCBA63"/>
    <circle cx="32"  cy="54"  r="13" fill="#FCBA63"/>
  </g>

  <!-- Stem of the 'i' — preserving the original's slanted-bottom geometry -->
  <path d="M 232 322
           L 280 322
           L 280 470
           C 253.5 470, 232 448.5, 232 422
           L 232 322 Z"
        fill="#F7941D"/>
</svg>
