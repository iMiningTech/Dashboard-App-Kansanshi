<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="atlas-globe-wireframe">
  <title>ATLAS — Wireframe Globe</title>
  <!-- App-icon background (navy rounded square, iOS-style) -->
  <rect width="512" height="512" rx="96" fill="#002741"/>

  <!-- The dot of the 'i' reinterpreted as a wireframe globe -->
  <g transform="translate(256 192)" stroke="#F7941D" stroke-linecap="round" fill="none">
    <!-- Globe outline -->
    <circle cx="0" cy="0" r="108" stroke-width="14"/>
    <!-- Equator (straight line through middle) -->
    <line x1="-108" y1="0" x2="108" y2="0" stroke-width="7"/>
    <!-- Tropic-like latitude lines (flattened ellipses) -->
    <ellipse cx="0" cy="-52" rx="95" ry="14" stroke-width="5" opacity="0.9"/>
    <ellipse cx="0" cy="52" rx="95" ry="14" stroke-width="5" opacity="0.9"/>
    <!-- Meridian (vertical ellipse) -->
    <ellipse cx="0" cy="0" rx="36" ry="108" stroke-width="5"/>
    <!-- Polar axis dot (echoes the small satellite in original 'i') -->
    <circle cx="72" cy="-58" r="11" fill="#FCBA63" stroke="none"/>
  </g>

  <!-- Stem of the 'i' — rounded-bottom bar, echoing the original logo geometry -->
  <path d="M 232 322 L 280 322 L 280 446 Q 280 470 256 470 Q 232 470 232 446 Z" fill="#F7941D"/>
</svg>
