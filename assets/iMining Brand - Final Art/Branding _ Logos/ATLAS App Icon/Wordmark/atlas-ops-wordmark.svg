<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 260" id="atlas-ops-wordmark">
  <title>ATLAS OPS — wordmark</title>
  <desc>All-orange wordmark. The O of OPS is a wireframe globe with site pins, an active-asset halo, a dotted arc echoing the iMining brand DNA, and a subtle network edge.</desc>

  <!-- "ATLAS" -->
  <text x="40" y="215"
        font-family="Lato, Inter, 'Helvetica Neue', 'Arial Black', sans-serif"
        font-weight="900" font-size="200" letter-spacing="-6"
        fill="#F7941D">ATLAS</text>

  <!-- The globe-as-O of OPS -->
  <g transform="translate(810 122)">

    <!-- Outer globe ring (the letterform body) -->
    <circle cx="0" cy="0" r="86" fill="none" stroke="#F7941D" stroke-width="26"/>

    <!-- Wireframe grid: equator + two parallels + two meridians -->
    <line x1="-71" y1="0" x2="71" y2="0"
          stroke="#F7941D" stroke-width="3" opacity="0.55" stroke-linecap="round"/>
    <ellipse cx="0" cy="-32" rx="63" ry="9"
             stroke="#F7941D" stroke-width="2" fill="none" opacity="0.42"/>
    <ellipse cx="0" cy="32"  rx="63" ry="9"
             stroke="#F7941D" stroke-width="2" fill="none" opacity="0.42"/>
    <ellipse cx="0" cy="0" rx="30" ry="72"
             stroke="#F7941D" stroke-width="2.5" fill="none" opacity="0.5"/>
    <ellipse cx="0" cy="0" rx="58" ry="72"
             stroke="#F7941D" stroke-width="1.5" fill="none" opacity="0.32"/>

    <!-- Dotted arc — the iMining signature, four dots leading into the primary pin -->
    <circle cx="-50" cy="-46" r="2"   fill="#F7941D" opacity="0.40"/>
    <circle cx="-42" cy="-55" r="2.5" fill="#F7941D" opacity="0.55"/>
    <circle cx="-33" cy="-61" r="3"   fill="#F7941D" opacity="0.72"/>
    <circle cx="-22" cy="-64" r="3.5" fill="#F7941D" opacity="0.90"/>

    <!-- Network edge — dashed curve from primary pin to a supporting site -->
    <path d="M -14 -28 Q 8 -22 28 -14"
          stroke="#FCBA63" stroke-width="2" fill="none"
          stroke-dasharray="2.5 3.5" opacity="0.7"/>

    <!-- Primary site pin — halo ring + filled pin + cream center -->
    <circle cx="-22" cy="-32" r="22" fill="none" stroke="#F7941D" stroke-width="1.5" opacity="0.40"/>
    <circle cx="-22" cy="-32" r="14" fill="#F7941D"/>
    <circle cx="-22" cy="-32" r="6"  fill="#FFDAA2"/>

    <!-- Supporting site pins -->
    <circle cx="32"  cy="-12" r="10" fill="#FCBA63"/>
    <circle cx="-30" cy="26"  r="10" fill="#FCBA63"/>
    <circle cx="22"  cy="38"  r="10" fill="#FCBA63"/>
  </g>

  <!-- "PS" -->
  <text x="920" y="215"
        font-family="Lato, Inter, 'Helvetica Neue', 'Arial Black', sans-serif"
        font-weight="900" font-size="200" letter-spacing="-6"
        fill="#F7941D">PS</text>
</svg>
