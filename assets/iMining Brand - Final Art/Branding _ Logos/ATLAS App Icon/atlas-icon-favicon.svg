<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" id="atlas-icon-favicon">
  <title>iMining ATLAS — Favicon (simplified)</title>
  <desc>Simplified version for tiny sizes (16/32px). One prominent pin, no grid, thicker strokes for clarity at micro-scale.</desc>

  <!-- Background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#002741"/>

  <g transform="translate(256 192)">
    <!-- Globe ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#F7941D" stroke-width="18"/>
    <!-- Single prominent pin (filled circle inside the ring) -->
    <circle cx="0" cy="0" r="42" fill="#F7941D"/>
    <circle cx="0" cy="0" r="18" fill="#FFDAA2"/>
  </g>

  <!-- Stem (preserves authentic slanted bottom) -->
  <path d="M 232 322 L 280 322 L 280 470
           C 253.5 470, 232 448.5, 232 422
           L 232 322 Z"
        fill="#F7941D"/>
</svg>
